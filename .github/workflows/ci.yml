name: CI & Deterministic Agent Evaluation

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

# Force Node 24 runtime across all runner actions without deprecation warnings
env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: "false"

jobs:
  code-quality-and-security:
    name: 🛡️ Code Quality & Secret Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m compileall backend/app
          echo "✅ All Python backend modules compiled with 0 syntax errors."

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Frontend Package Integrity
        run: |
          node -e "JSON.parse(require('fs').readFileSync('frontend/package.json')); console.log('✅ frontend/package.json is valid JSON.');"

      - name: Check for Uncommitted .env or Secret Files
        run: |
          MATCHES=$(git ls-files | grep -E '\.env$|\.key$|\.pem$' || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ ERROR: Detected secret file in Git index: $MATCHES"
            exit 1
          else
            echo "✅ Verified: Zero secret files tracked in Git."
          fi

  backend-tests:
    name: 🧪 Backend Test Suite (27 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          RAZORPAY_KEY_ID: rzp_test_ci_mock_key
          RAZORPAY_KEY_SECRET: ci_mock_secret
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build:
    name: ⚡ Frontend Production Build (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Production Bundle
        run: |
          cd frontend
          npm run build

  benchmark-evaluation:
    name: 📊 2,500 Empirical Benchmark Verification
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Empirical Evaluator
        env:
          ENVIRONMENT: test
          RAZORPAY_KEY_ID: rzp_test_ci_mock_key
          RAZORPAY_KEY_SECRET: ci_mock_secret
        run: |
          cd backend
          python -m app.data.benchmark_eval

  docker-build-verification:
    name: 🐳 Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality-and-security, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t razorrecover-backend:test ./backend

      - name: Build Frontend Image
        run: |
          docker build -t razorrecover-frontend:test ./frontend
